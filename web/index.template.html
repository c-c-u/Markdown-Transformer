<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公式编辑器 · Markdown 实时输出</title>
<style>
  :root{
    --bg:#f3f5fb; --card:#ffffff; --border:#dfe4f1; --text:#1f2937; --muted:#6b7280;
    --accent:#4f46e5; --accent-dark:#4338ca; --success:#15803d; --warning:#b45309;
    --soft-accent:#eef2ff; --canvas-bg:#fcfcff; --preview-bg:#fcfcff; --editor-bg:#fbfcff;
    --ph-fill:#fff7dd; --ph-outline:#d99a2b; --selection-fill:#dbe2fe;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    font-size:14px;padding:20px 22px 26px;
  }
  .app{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  header h1{font-size:21px;margin:0 0 3px;font-weight:700}
  header .sub{color:var(--muted);margin:0;font-size:13px}
  .badge{
    background:var(--soft-accent);color:var(--accent);font-size:12px;font-weight:700;
    padding:7px 13px;border-radius:8px;white-space:nowrap;
  }
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 18px 0;flex-wrap:wrap}
  .card-title{font-weight:700;font-size:13px}
  .muted{color:var(--muted);font-size:12px}
  .toolbar,.symbols,.categories{display:flex;flex-direction:column;gap:8px;padding:10px 18px 2px}
  .toolbar{padding-bottom:4px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .row-label{color:var(--muted);font-size:12px;margin-right:4px}
  .sep{width:1px;height:20px;background:var(--border);margin:0 5px}
  button{
    border:1px solid var(--border);background:#f8faff;color:var(--text);border-radius:7px;
    padding:6px 10px;cursor:pointer;font-size:13px;font-family:inherit;line-height:1.2;
  }
  button:hover{background:var(--soft-accent);border-color:#c7d2fe;color:var(--accent)}
  button:active{background:#e6e9f5}
  button:disabled{opacity:.5;cursor:default;color:var(--muted)}
  .symbol-btn{font-family:"Segoe UI Symbol","Cambria Math",Arial,sans-serif;font-size:13px;padding:5px 8px;background:#fbfcff}
  .ghost-btn{background:transparent;border-color:transparent;color:var(--muted);padding:6px 9px}
  .ghost-btn:hover{background:var(--soft-accent)}
  .dropdown{position:relative;display:inline-block}
  .dropdown > button.open{background:var(--soft-accent);border-color:#c7d2fe;color:var(--accent)}
  .dropdown-panel{
    position:absolute;top:calc(100% + 4px);left:0;z-index:40;
    background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 28px rgba(15,23,42,.12);
    padding:5px;display:flex;flex-direction:column;gap:2px;min-width:150px;max-width:320px;
    max-height:340px;overflow:auto;
  }
  .dropdown-panel[hidden]{display:none}
  .submenu{display:flex;flex-direction:column}
  .submenu-list{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:2px solid var(--border);margin-left:4px}
  .submenu-list[hidden]{display:none}
  .dropdown-panel.nested{top:0;left:calc(100% + 4px)}
  .menu-item{
    text-align:left;border:0;background:transparent;padding:6px 10px;border-radius:6px;
    white-space:nowrap;font-size:13px;
  }
  .menu-item:hover{background:var(--soft-accent);color:var(--accent)}
  .menu-item.sub{color:var(--text)}
  .menu-item.glyph{font-family:"Segoe UI Symbol","Cambria Math",Arial,sans-serif;font-size:15px}
  .submenu{position:relative}
  .canvas-shell{background:var(--border);border-radius:8px;margin:8px 18px 0;padding:1px}
  canvas{
    display:block;width:100%;min-height:120px;background:var(--canvas-bg);
    border-radius:7px;outline:none;cursor:text;
  }
  .canvas-footer{display:flex;justify-content:space-between;gap:12px;padding:8px 18px 12px;font-size:12px;color:var(--muted)}
  .canvas-footer .hint{color:#9ca3af;white-space:nowrap}
  .action-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .action-row .copy-note{color:var(--muted);font-size:13px}
  .primary-btn{
    border:0;background:var(--accent);color:#fff;font-weight:700;
    padding:11px 22px;border-radius:8px;font-size:14px;
  }
  .primary-btn:hover{background:var(--accent-dark);color:#fff}
  .primary-btn:disabled{background:#c7d2fe;color:#fff;cursor:default}
  .output-grid{display:grid;grid-template-columns:3fr 2fr;gap:12px;padding:10px 18px 16px}
  @media (max-width:900px){.output-grid{grid-template-columns:1fr}}
  .pane{background:var(--editor-bg);border:1px solid var(--border);border-radius:8px;padding:10px;min-height:140px}
  .pane-head{color:var(--muted);font-size:12px;margin-bottom:6px}
  pre#markdown{
    margin:0;font-family:"Cascadia Code",Consolas,"Courier New",monospace;font-size:13px;
    white-space:pre-wrap;word-break:break-word;min-height:110px;color:#111827;
  }
  #preview{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:110px;text-align:center;gap:6px;
  }
  .preview-msg{color:var(--muted);font-size:12.5px;line-height:1.7;white-space:pre-line}
  .preview-fallback{margin:0;text-align:left;font-size:13px;color:#334155;white-space:pre-wrap;max-width:100%;overflow:auto}
  .status-bar{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#9ca3af;padding:0 4px}
  .status-text.muted{color:var(--muted)}
  .status-text.info{color:var(--text)}
  .status-text.success{color:var(--success)}
  .status-text.warning{color:var(--warning)}
  .status-text.danger{color:#b91c1c}
  #toast{
    position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-12px);
    background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:all .18s ease;max-width:min(640px,90vw);
    white-space:pre-line;z-index:80;box-shadow:0 10px 30px rgba(15,23,42,.25);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>公式编辑器</h1>
      <p class="sub">点击方框直接输入 · 插入模板 · Markdown 源码与预览</p>
    </div>
    <span class="badge">可视化编辑 → Markdown</span>
  </header>

  <section class="card">
    <div class="card-head">
      <span class="card-title">公式编辑 · 实时预览</span>
      <span class="muted">点击文本边缘/算符两侧添加项；拖动可选中内容；←/→ 切换输入位置，↑/↓ 切换上下格位</span>
    </div>
    <div class="toolbar" id="toolbar"></div>
    <div class="symbols" id="symbols"></div>
    <div class="categories" id="categories"></div>
    <div class="canvas-shell"><canvas id="canvas" tabindex="0"></canvas></div>
    <div class="canvas-footer">
      <span id="canvas-status"></span>
      <span class="hint">拖动鼠标可选中一段内容 · Enter 复制</span>
    </div>
  </section>

  <section class="action-row">
    <span class="copy-note">Markdown 源码与渲染预览会随公式实时更新；填满所有方框后即可复制。</span>
    <button id="copy" class="primary-btn" disabled>复制 Markdown</button>
  </section>

  <section class="card">
    <div class="card-head">
      <span class="card-title">Markdown 输出</span>
      <span class="muted">源码与预览实时同步</span>
    </div>
    <div class="output-grid">
      <div class="pane">
        <div class="pane-head">Markdown 源码</div>
        <pre id="markdown"></pre>
      </div>
      <div class="pane">
        <div class="pane-head">实时预览</div>
        <div id="preview"></div>
      </div>
    </div>
  </section>

  <div class="status-bar">
    <span class="status-text muted" id="status"></span>
    <span>单文件网页版 · 无需安装</span>
  </div>
</div>

<div id="toast"></div>

<script>
/*__APP_JS__*/
</script>
</body>
</html>
